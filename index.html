<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteriaa - Explore the Universe</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Dark base color for galaxy effect */
            background-color: #0A1051;

            /* CRITICAL: This is the anchor for our blobs */
            position: relative;

            /* CRITICAL: This clips the blobs so they don't cause scrollbars */
            overflow: hidden;
        }

        /* Main content container */
        .content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            text-align: center;

            /* CRITICAL: Puts the content on a "layer" above the blobs */
            position: relative;
            z-index: 1;

            /* Text colors */
            color: #ffffff99;
        }

        .content h1 {
            color: #ACFDFE;
            font-weight: 600;
            font-size: 4rem;
            margin: 0 0 20px 0;
            letter-spacing: -1px;
        }

        .content h2 {
            color: #00A8F7;
            font-weight: 400;
            font-size: 1.5rem;
            margin: 0 0 30px 0;
        }

        .content p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
            margin: 0 0 40px 0;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #172090, #00A8F7);
            color: #ACFDFE;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(172, 253, 254, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(172, 253, 254, 0.5);
        }

        /* THE BLOB STYLES */
        .blob {
            /* Takes the blob out of the normal page flow */
            position: absolute;

            /* Makes them circles */
            border-radius: 50%;

            /* THE MAGIC: This applies a heavy blur */
            filter: blur(150px);

            /* Makes them soft and blend well */
            opacity: 0.6;

            /* CRITICAL: Puts the blobs *behind* the content */
            z-index: -1;

            /* Add smooth animation */
            animation: float 20s ease-in-out infinite;
        }

        /* Define each blob's color, size, and position */
        .blob-1 {
            background: #172090; /* Purple-blue */
            width: 450px;
            height: 450px;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            background: #00A8F7; /* Medium blue */
            width: 350px;
            height: 350px;
            bottom: -100px;
            right: -100px;
            animation-delay: -7s;
        }

        .blob-3 {
            background: #ACFDFE; /* Light blue */
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.3;
            animation-delay: -14s;
        }

        .blob-4 {
            background: #5B2E9D; /* Deep purple */
            width: 400px;
            height: 400px;
            top: 20%;
            right: 10%;
            opacity: 0.4;
            animation-delay: -3s;
        }

        .blob-5 {
            background: #1E40AF; /* Royal blue */
            width: 280px;
            height: 280px;
            bottom: 30%;
            left: 15%;
            opacity: 0.5;
            animation-delay: -10s;
        }

        /* Floating animation for galaxy effect */
        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .content h1 {
                font-size: 2.5rem;
            }

            .content h2 {
                font-size: 1.2rem;
            }

            .content p {
                font-size: 1rem;
            }

            .blob-1, .blob-2, .blob-3, .blob-4, .blob-5 {
                filter: blur(100px);
            }
        }

    </style>
</head>
<body>

    <!-- Galaxy gradient blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>

    <!-- Main content -->
    <div class="content">
        <h1>Asteriaa</h1>
        <h2>Explore the Universe</h2>
        <p>
            Experience the cosmos with stunning galaxy gradients and immersive visual effects.
            Journey through space with cutting-edge design that brings the stars to your screen.
        </p>
        <a href="#" class="cta-button">Get Started</a>
    </div>

</body>
</html>
